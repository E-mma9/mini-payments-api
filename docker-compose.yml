services:
  database:
    image: "postgres:17"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments 
    
  app:
    build: .
    depends_on:
      - database
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/payments 
      SPRING_DATASOURCE_USERNAME: payments 
      SPRING_DATASOURCE_PASSWORD: payments

