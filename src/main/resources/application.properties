spring.application.name=mini-payments-api

# Defaults to an in-memory H2 database so the app starts without any database server.
# To use PostgreSQL, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD: Spring Boot's relaxed binding maps those environment
# variables onto spring.datasource.* and they take precedence over this file.
# Username/password are omitted here; for embedded H2 Spring Boot defaults to "sa".
spring.datasource.url=jdbc:h2:mem:payments

# Flyway creates and changes the tables (src/main/resources/db/migration).
# Hibernate only checks on startup that the tables match the entities.
spring.jpa.hibernate.ddl-auto=validate

# Keep database access inside the service layer's transactions, not the HTTP view rendering.
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,prometheus
