apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-payments-deployment
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: mini-payments-container
        image: mini-payments-api:dev
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: mini-payments-config
        - secretRef:
            name: mini-payments-secrets
            