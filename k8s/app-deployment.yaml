apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app
  name: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  strategy: {}
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - image: mini-payments-api:dev
        name: mini-payments-api
        env:  
        - name: SPRING_DATASOURCE_URL
          value:  jdbc:postgresql://database:5432/payments 
        - name: SPRING_DATASOURCE_USERNAME
          value: payments
        - name: SPRING_DATASOURCE_PASSWORD
          value: payments 
